<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saito Kurosaki</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F4F5F6] pl-3 pr-3 pt-2 pb-2 fonttext">
    <div
      class="bg-[#FEFEFE] h-dvh rounded-lg shadow-2xs overflow-hidden border-[#8080801f] border"
    >
      <header>
        <nav
          class="flex justify-evenly items-center p-10 shadow-sm rounded-lg bg-[#FEFEFE] border-[#8080801f] border"
        >
          <ul
            class="flex gap-20 items-center text-[#1A1A1A] font-semibold text-lg list-none"
          >
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">SKILLS</a></li>
            <li><a href="#">PROJECT</a></li>
            <li><a href="#">STATS</a></li>
            <li><a href="#">CONTACT</a></li>
          </ul>
          <!--<button type="button" class="cursor-pointer">
            <img
              src="../svg/light.svg"
              alt="light"
              class="w-12 h-12 p-3 border border-[#cdcfd3] rounded-lg"
            />
          </button>
        --></nav>
        <section id="home" class="relative h-dvh rounded-lg">
          <img
            src="../Pictures/1.png"
            class="absolute inset-0 w-full h-full object-contain mix-blend-multiply pointer-events-none"
          />

          <div
            class="relative z-10 flex items-center justify-between align-center h-full mr-10 ml-10"
          >
            <div class="herocontent max-w-180 flex flex-col gap-5">
              <p class="text-gray-500 text-xl">HELLO, IM</p>
              <p
                class="fonttext leading-none font-semibold text-[clamp(2rem,6.667vw,8rem)]"
              >
                SAITO KUROSAKI
              </p>
              <p class="text-2xl font-bold">
                <span class="mr-5">></span> Web Developer & Software Developer
              </p>
              <p class="text-gray-500 text-xl">
                I enjoy building websites and software, as well as exploring the
                internet
              </p>
              <div class="socials flex gap-5">
                <a href="#"
                  ><img
                    src="../svg/github.svg"
                    class="w-15 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border-[#8080801f] border hover:-translate-y-4 transition-transform duration-300"
                /></a>
                <a href="#"
                  ><img
                    src="../svg/discord.svg"
                    class="w-15 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border-[#8080801f] border hover:-translate-y-4 transition-transform duration-300"
                /></a>
                <a href="#"
                  ><img
                    src="../svg/youtube.svg"
                    class="w-15 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border-[#8080801f] border hover:-translate-y-4 transition-transform duration-300"
                /></a>
                <a href="#"
                  ><img
                    src="../svg/tiktok.svg"
                    class="w-15 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border-[#8080801f] border hover:-translate-y-4 transition-transform duration-300"
                /></a>
              </div>
            </div>
            <div
              class="discord min-h-120 max-h-max w-100 bg-[#FEFEFE] shadow-sm rounded-lg border-[#8080801f] border flex flex-col"
            >
              <div class="discordlogo flex p-5 gap-3 text-sm items-center">
                <img src="../svg/discord.svg" class="w-10" />
                <p>DISCORD PRESENCE</p>
              </div>
              <div class="h-0.5 w-90 bg-gray-400 opacity-40 mx-auto">
                <!--Separator -->
              </div>
              <div class="profile flex p-5 gap-5">
                <div class="profilepic relative">
                  <img class="discordpicture rounded-full w-25 h-25" />
                  <img
                    class="onlinestatus absolute bottom-1 right-0 w-7 bg-[#FEFEFE] rounded-full border-2 border-[#FEFEFE] text-sm"
                  />
                  <img class="decoration absolute inset-0" />
                </div>

                <div class="discordname flex flex-col gap-2">
                  <p id="name"></p>
                  <p id="username"></p>
                  <p
                    id="status"
                    class="bg-[#f8eacf] rounded-full h-fit w-fit text-[#ffab04] pr-4 pl-4 pt-0.5 pb-0.5"
                  ></p>
                </div>
              </div>
              <div class="h-0.5 w-90 bg-gray-400 opacity-40 mx-auto">
                <!--Separator -->
              </div>
              <div class="activitystatus flex gap-3 p-5"></div>
              <div class="h-0.5 w-90 bg-gray-400 opacity-40 mx-auto">
                <!--Separator -->
              </div>
              <div class="timeelapse p-5 flex items-center gap-3">
                <img src="svg/time.svg" class="w-10" />
                <p id="elapseTime"></p>
              </div>
            </div>
          </div>
        </section>
      </header>
    </div>
    <script src="../src/app.js"></script>
  </body>
</html>
