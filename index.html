<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Saito Kurosaki</title>

    <link rel="stylesheet" href="../src/output.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-[#F4F5F6] p-2 fonttext">
    <div
      class="bg-[#FEFEFE] min-h-dvh rounded-lg shadow-2xs overflow-hidden border border-[#8080801f]"
    >
      <header>
        <nav
          class="flex items-center justify-center p-10 max-md:p-5 max-sm:p-2 rounded-lg bg-[#FEFEFE] border border-[#8080801f] w-full max-md:justify-end shadow-sm relative z-11"
        >
          <ul
            class="flex gap-20 max-lg:gap-10 items-center text-[#1A1A1A] font-semibold text-lg list-none max-md:hidden"
          >
            <li><a href="#" class="text-base">HOME</a></li>
            <li><a href="#" class="text-base">ABOUT</a></li>
            <li><a href="#" class="text-base">SKILLS</a></li>
            <li><a href="#" class="text-base">PROJECT</a></li>
            <li><a href="#" class="text-base">STATS</a></li>
            <li><a href="#" class="text-base">CONTACT</a></li>
          </ul>

          <a href="#">
            <img
              src="../svg/burger-menu.svg"
              alt="Menu"
              class="w-12 max-md:w-10 p-3 max-md:p-2 border border-[#cdcfd3] rounded-lg md:hidden"
            />
          </a>
        </nav>

        <section id="home" class="min-h-dvh rounded-lg max-lg:min-h-0">
          <div
            class="relative z-10 flex items-center min-h-dvh max-sm:mx-2 mx-5 max-lg:min-h-0 max-lg:flex-col max-lg:gap-10 max-lg:py-10"
          >
            <img
              src="../Pictures/1.png"
              alt=""
              class="absolute max-sm:left-10 w-full h-full max-changepic:object-cover object-contain mix-blend-multiply pointer-events-none max-lg:h-auto max-lg:top-0"
            />

            <div
              class="max-lg:justify-end flex flex-col gap-5 w-full justify-center max-lg:min-h-120 max-sm:min-h-100"
            >
              <p
                class="text-gray-500 text-[clamp(1rem,1.041vw,1.25rem)] leading-[1.4]"
              >
                HELLO, IM
              </p>

              <p
                class="fonttext leading-none font-semibold text-[clamp(2rem,6.667vw,8rem)] max-w-100"
              >
                SAITO KUROSAKI
              </p>

              <div class="flex items-center gap-5 max-lg:gap-3 max-sm:gap-1">
                <img
                  src="../svg/greaterthan.svg"
                  alt=">"
                  class="w-10 max-lg:w-8 max-md:w-7 max-sm:w-6"
                />

                <p class="font-bold text-[clamp(0.8rem,1.25vw,1.5rem)]">
                  Web Developer & Software Developer
                </p>
              </div>

              <p
                class="text-gray-500 text-[clamp(1rem,1.041vw,1.25rem)] leading-[1.4]"
              >
                I enjoy building websites and software, as well as exploring the
                internet
              </p>

              <div class="flex gap-5">
                <a href="#">
                  <img
                    src="../svg/github.svg"
                    alt="GitHub"
                    class="w-15 max-lg:w-13 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border border-[#8080801f] hover:-translate-y-4 transition-transform duration-300"
                  />
                </a>

                <a href="#">
                  <img
                    src="../svg/discord.svg"
                    alt="Discord"
                    class="w-15 max-lg:w-13 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border border-[#8080801f] hover:-translate-y-4 transition-transform duration-300"
                  />
                </a>

                <a href="#">
                  <img
                    src="../svg/youtube.svg"
                    alt="YouTube"
                    class="w-15 max-lg:w-13 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border border-[#8080801f] hover:-translate-y-4 transition-transform duration-300"
                  />
                </a>

                <a href="#">
                  <img
                    src="../svg/tiktok.svg"
                    alt="TikTok"
                    class="w-15 max-lg:w-13 p-3 bg-[#FEFEFE] rounded-lg shadow-sm border border-[#8080801f] hover:-translate-y-4 transition-transform duration-300"
                  />
                </a>
              </div>
            </div>

            <div
              class="discord relative h-full w-full max-w-100 bg-[#FEFEFE] shadow-sm rounded-lg border border-[#8080801f] flex flex-col justify-center"
            >
              <div class="flex p-5 gap-3 text-sm items-center">
                <img
                  src="../svg/discord.svg"
                  alt="Discord"
                  class="w-10 max-sm:w-8"
                />

                <p class="text-base max-sm:text-sm">DISCORD PRESENCE</p>
              </div>

              <div class="h-0.5 w-[90%] bg-gray-400 opacity-40 mx-auto"></div>

              <div class="flex p-5 gap-5">
                <div class="relative">
                  <img class="discordpicture rounded-full w-25 max-sm:w-23" />

                  <img
                    class="onlinestatus absolute bottom-1 right-0 w-7 bg-[#FEFEFE] rounded-full border-2 border-[#FEFEFE]"
                  />

                  <img class="decoration absolute inset-0" />
                </div>

                <div class="flex flex-col gap-2 justify-center">
                  <p
                    id="name"
                    class="text-lg max-sm:text-base font-semibold"
                  ></p>

                  <p
                    id="username"
                    class="text-base max-sm:text-sm text-gray-500"
                  ></p>

                  <div class="status"></div>
                </div>
              </div>

              <div class="h-0.5 w-[90%] bg-gray-400 opacity-40 mx-auto"></div>

              <div class="activitystatus flex gap-3 p-5"></div>

              <div class="h-0.5 w-[90%] bg-gray-400 opacity-40 mx-auto"></div>

              <div class="p-5 flex items-center gap-3">
                <img src="../svg/time.svg" alt="Time" class="w-10 max-sm:w-8" />

                <p id="elapseTime" class="text-base max-sm:text-sm"></p>
              </div>
            </div>
          </div>
        </section>
      </header>
    </div>

    <script src="../src/app.js"></script>
  </body>
</html>
